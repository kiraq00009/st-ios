# Studio — لوحة تحكّم المالك لكلّ مشاريعه (XcodeGen، بناء سحابيّ)
name: Studio
options:
  bundleIdPrefix: watch.dawwirli
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
targets:
  Studio:
    type: application
    platform: iOS
    sources:
      - path: Studio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: watch.dawwirli.studio
        PRODUCT_NAME: Studio
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Studio"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Studio/Info.plist
      properties:
        UIAppFonts: [plex_r.ttf, plex_m.ttf, plex_sb.ttf, plex_b.ttf]
        UIUserInterfaceStyle: Dark
        CFBundleDevelopmentRegion: ar
        UILaunchScreen:
          UIColorName: ""
